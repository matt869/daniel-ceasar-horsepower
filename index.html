<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Horsepower — full lyric animation</title>
<style>html{background:#040817}body{margin:0;padding:24px 16px;min-height:100vh;box-sizing:border-box;display:grid;place-items:center}main{width:100%}@media(max-width:480px){body{padding:12px}}</style>
</head>
<body>
<main>
<div id="baby-please-visual">
  <section class="bp-player" aria-label="Horsepower lyric animation with the full supplied audio">
    <div class="bp-artwork">
      <img class="bp-photo" src="photo.png" alt="Your blue night photograph, with a luminous figure in a field">
      <div class="bp-photo-echo" aria-hidden="true"></div>
      <div class="bp-light" aria-hidden="true"></div>
      <div class="bp-shade" aria-hidden="true"></div>
      <canvas class="bp-particles" width="680" height="680" aria-hidden="true"></canvas>
      <canvas class="bp-grain" width="160" height="160" aria-hidden="true"></canvas>
      <div class="bp-scanlines" aria-hidden="true"></div>
      <div class="bp-orbit" aria-hidden="true">✦</div>
      <div class="bp-lyrics" aria-live="off">
        <div class="bp-lyric-shadow" aria-hidden="true"></div>
        <div class="bp-phrase"></div>
        <div class="bp-underline" aria-hidden="true"></div>
      </div>
      <div class="bp-film-bottom" aria-hidden="true"><div class="bp-wave"></div></div>
      <div class="bp-edge" aria-hidden="true"></div>
      <button class="bp-surface-toggle" type="button" aria-label="Play music and animation"></button>
    </div>
    <span class="bp-sr bp-audio-status" role="status">Tap the image to play.</span>
    <audio class="bp-audio" preload="auto" src="horsepower-full.m4a"></audio>
    <p class="bp-sr">The complete music section from your uploaded clip, with the TikTok outro removed. The on-screen lyrics mask the requested word; the music remains uncensored.</p>
  </section>
</div>
<link rel="stylesheet" href="styles.css">
<script src="animation.js"></script>
</main>
</body>
</html>
