<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Baby please — lyric visual</title>
<style>html{background:#040817}body{margin:0;padding:24px 16px;min-height:100vh;box-sizing:border-box;display:grid;place-items:center}main{width:100%}@media(max-width:480px){body{padding:12px}}</style>
</head>
<body>
<main>
<div id="baby-please-visual">
  <section class="bp-player" aria-label="Animated lyric visual for the supplied Daniel Caesar excerpt">
    <div class="bp-artwork">
      <img class="bp-photo" src="photo.png" alt="A glowing figure in a deep blue field at night, from your supplied photo">
      <video class="bp-video" src="horsepower-censored.mp4" preload="auto" playsinline disablepictureinpicture></video>
      <div class="bp-shade" aria-hidden="true"></div>
      <canvas class="bp-grain" width="180" height="180" aria-hidden="true"></canvas>
      <div class="bp-scanlines" aria-hidden="true"></div>
      <div class="bp-topline"><span class="bp-artist">DANIEL CAESAR</span><span class="bp-edition">HORSEPOWER / 01</span></div>
      <div class="bp-orbit" aria-hidden="true">✦</div>
      <div class="bp-lyrics" aria-live="off">
        <div class="bp-kicker"></div>
        <div class="bp-phrase"></div>
      </div>
      <div class="bp-film-bottom"><span class="bp-take">LINE 01 / 03</span><div class="bp-wave" aria-hidden="true"></div><span class="bp-timecode">00:00</span></div>
      <div class="bp-edge" aria-hidden="true"></div>
    </div>
    <div class="bp-controls">
      <div class="bp-control-row">
        <div class="bp-actions">
          <button class="bp-toggle" type="button" aria-label="Play music and animation"><span class="bp-play-icon" aria-hidden="true">▶</span><span class="bp-toggle-text">Play</span></button>
          <button class="bp-replay" type="button" aria-label="Replay from the beginning">↺ <span>Replay</span></button>
        </div>
        <button class="bp-mute" type="button" aria-label="Mute audio" aria-pressed="false">Sound on</button>
      </div>
      <label class="bp-timeline-label"><span class="bp-sr">Animation position</span><input class="bp-timeline" type="range" min="0" max="19.3" step="0.01" value="0" aria-label="Animation position in seconds"></label>
      <div class="bp-status-row"><span class="bp-audio-status" role="status">Your clip · censored · press Play</span><span class="bp-duration">00:00 / 00:19</span></div>
      <audio class="bp-audio" preload="none" src="horsepower-censored.mp3"></audio>
    </div>
    <p class="bp-sr">The supplied lyric: Baby please, why won't these [censored] just stop playing with me? I display greatness for the world to see. It starts with me and it ends with me.</p>
  </section>
</div>
<link rel="stylesheet" href="styles.css">
<script src="animation.js"></script>
</main>
</body>
</html>
